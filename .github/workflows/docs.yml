name: Build Documentation

on:
  push:
    branches:
      - main  # Укажите здесь вашу основную ветку

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'  # Укажите нужную версию Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-autodoc-typehints  # Укажите другие зависимости, если нужно

    - name: Build Documentation
      run: |
        cd docs  # Переходим в папку с документацией
        make html  # Или используйте другой способ сборки, если он у вас настроен
