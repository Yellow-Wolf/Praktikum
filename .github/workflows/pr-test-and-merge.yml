name: PR Test and Merge

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install required packages
        run: |
          pip install pylint pytest  # Установка линтера и pytest для тестирования

      - name: Lint text files
        run: |
          for file in *.txt; do
            if [ -s "$file" ]; then
              echo "$file is not empty"
            else
              echo "$file is empty"
              exit 1  # Ошибка, если текстовый файл пустой
            fi
          done

      - name: Run tests
        run: |
          pytest  # Запуск тестов с помощью pytest

  merge:
    if: success()
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Merge pull request
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
