name: CI Process

on:
  pull_request:
    branches:
      - main  # Запускать при создании PR в ветку main
  push:
    branches:
      - main  # Запускать при пушах в ветку main (например, для мержей)

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install required packages
        run: |
          pip install pylint pytest  # Установка линтера и pytest для тестирования

      - name: Lint text files
        run: |
          for file in *.txt; do
            if [ -s "$file" ]; then
              echo "$file is not empty"
            else
              echo "$file is empty"
              exit 1  # Ошибка, если текстовый файл пустой
            fi
          done

      - name: Run tests
        run: |
          pytest  # Запуск тестов с помощью pytest

  merge:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' && success()  # Проверяем, что это PR и предыдущие job успешен

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install GitHub CLI
        run: |
          sudo apt-get install -y gh

      - name: Merge pull request
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Использование встроенного токена доступа
